[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zephyr-aero"
version = "0.1.0"
description = "Evidence-first aerodynamic design copilot"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zephyr-day0 = "zephyr.probes.day0:main"
zephyr-config = "zephyr.config:main"

[tool.setuptools.packages.find]
where = ["src"]
